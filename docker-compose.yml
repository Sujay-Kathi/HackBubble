services:
  # ── PostgreSQL 16 with pgvector ───────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: hackbubble-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackbubble
      POSTGRES_PASSWORD: hackbubble_dev
      POSTGRES_DB: hackbubble
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackbubble -d hackbubble"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── HackBubble Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackbubble-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: HackBubble
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://hackbubble:hackbubble_dev@db:5432/hackbubble
      SECRET_KEY: change-me-in-production-use-a-32-char-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scraper:/scraper
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
